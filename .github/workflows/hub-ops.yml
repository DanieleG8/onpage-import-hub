name: Hub ops

# Ponte operativo verso il servizio Railway (la sandbox Claude non raggiunge
# up.railway.app): ogni azione chiama il hub via HTTPS e stampa la risposta nei
# log del run. Le azioni che lanciano un job fanno anche polling dello /status
# fino a fine corsa. Richiede il secret HUB_API_KEY (stesso valore di Railway).

on:
  workflow_dispatch:
    inputs:
      azione:
        description: "Azione sul hub"
        required: true
        type: choice
        default: health
        options:
          - health
          - img-test
          - img-url
          - status
          - errori
          - reinvia-falliti
          - riarma
          - payload
          - identita
          - grezzo
          - ordini
          - codici
          - prova
          - diff
          - feed-diff
          - bootstrap
          - stock
          - prezzi
          - prodotti
          - full
      fornitore:
        description: "Fornitore (makito | nwg)"
        required: false
        default: "makito"
      solo:
        description: "Chiavi da inviare (separate da spazio) per run mirati"
        required: false
        default: ""
      percorso:
        description: "Percorsi immagine per img-url (separati da spazio)"
        required: false
        default: ""
      chiavi:
        description: "Chiavi articolo per riarma (separate da spazio)"
        required: false
        default: ""
      workers:
        description: "Worker per i job di invio (vuoto = default 3)"
        required: false
        default: ""
      job:
        description: "Job da simulare con l'azione prova (stock | prezzi | prodotti)"
        required: false
        default: "prodotti"

env:
  HUB_URL: https://onpage-import-hub-production.up.railway.app

jobs:
  ops:
    runs-on: ubuntu-latest
    # Il lavoro gira su Railway: qui si fa solo da telecomando. Prima il runner
    # restava acceso fino a 5h50 a contare i secondi (2.381 minuti in 30 giorni).
    timeout-minutes: 20
    steps:
      - name: Esegui azione sul hub
        env:
          HUB_API_KEY: ${{ secrets.HUB_API_KEY }}
        run: |
          set -o pipefail
          azione="${{ inputs.azione }}"
          F="${{ inputs.fornitore }}"
          F="${F:-makito}"
          # la chiave articolo e' "<sigla>-<ref>": la sigla dipende dal fornitore
          case "$F" in
            makito) P="02-" ;; nwg) P="A1-" ;;
            pfconcept) P="34-" ;; garys) P="A3-" ;;
            *) P="" ;;
          esac
          case "$azione" in
            health)
              curl -sS -m 60 "$HUB_URL/health"
              ;;
            img-url)
              # testa uno o piu' percorsi (separati da spazio) passati in "percorso"
              for p in ${{ inputs.percorso }}; do
                curl -sS -m 120 -o /dev/null \
                  -w "$p -> HTTP %{http_code} type=%{content_type} bytes=%{size_download}\n" \
                  "$HUB_URL/img/makito/$p" || true
              done
              ;;
            img-test)
              curl -sS -m 120 -o /tmp/img.jpg \
                -w "HTTP %{http_code} content-type=%{content_type} bytes=%{size_download}\n" \
                "$HUB_URL/img/makito/15246/principal/5246-W.jpg"
              file /tmp/img.jpg || true
              ;;
            status)
              curl -sS -m 60 -H "x-api-key: $HUB_API_KEY" "$HUB_URL/status"
              ;;
            payload)
              for c in ${{ inputs.chiavi }}; do
                echo "== payload $c: articolo.immagine e prima variante =="
                curl -sS -m 60 -H "x-api-key: $HUB_API_KEY" "$HUB_URL/payload/$F/$c" \
                  | python3 -c 'import json,sys; a=json.load(sys.stdin)["articolo"]; v=(a.get("varianti") or [{}])[0]; print(json.dumps({"immagine": a.get("immagine"), "gallery": a.get("immagini"), "var0_immagine": v.get("immagine")}, ensure_ascii=False))'
              done
              ;;
            identita)
              # I CODICI, dal file del fornitore fino al payload inviato: serve a
              # verificare che su OnPage finisca il codice del fornitore e non una
              # nostra invenzione. In "chiavi" vanno le REF del fornitore, senza
              # sigla: 11021, non 02-11021.
              for r in ${{ inputs.chiavi }}; do
                echo "===== $F ref $r"
                echo "-- grezzo (come arriva dall'API del fornitore)"
                curl -sS -m 60 -H "x-api-key: $HUB_API_KEY" "$HUB_URL/raw/$F/$r" \
                  | python3 -c 'import json,sys; d=json.load(sys.stdin); e=(d.get("catalogo") or [{}])[0]; var=e.get("variants") or []; print(json.dumps({"ref": e.get("ref"), "name": e.get("name"), "varianti_totali": len(var), "prime_varianti": [{k: v.get(k) for k in ("variant_reference","variant_colorcode","variant_size","variant_name")} for v in var[:3]]}, ensure_ascii=False, indent=1))' || echo "   (snapshot non disponibile)"
                echo "-- payload (come lo abbiamo inviato)"
                curl -sS -m 60 -H "x-api-key: $HUB_API_KEY" "$HUB_URL/payload/$F/$P$r" \
                  | python3 -c 'import json,sys; a=json.load(sys.stdin)["articolo"]; var=a.get("varianti") or []; print(json.dumps({"codiceArticoloFornitore": a.get("codiceArticoloFornitore"), "chiaveArticolo": a.get("chiaveArticolo"), "descrizioneBreve": a.get("descrizioneBreve"), "varianti_totali": len(var), "prime_varianti": [{k: v.get(k) for k in ("codiceFornitore","codiceVariante","_matnr","_variant_name")} for v in var[:3]]}, ensure_ascii=False, indent=1))' || echo "   (payload non disponibile)"
              done
              ;;
            grezzo)
              # Tutti i campi del record del fornitore, con in evidenza quelli che
              # somigliano a un codice: serve a rispondere a "da che valore
              # prendiamo il codice articolo, e ce n'e' un altro piu' adatto?".
              for r in ${{ inputs.chiavi }}; do
                echo "===== $F ref $r"
                curl -sS -m 60 -H "x-api-key: $HUB_API_KEY" "$HUB_URL/raw/$F/$r" \
                  | python3 -c 'import json,sys; d=json.load(sys.stdin); e=(d.get("catalogo") or [{}])[0]; v=(e.get("variants") or [{}])[0]; cod=lambda o: {k: o[k] for k in sorted(o) if any(s in k.lower() for s in ("ref","cod","sku","matnr","ean","print","id"))}; print("blocchi snapshot:", sorted(d)); print("campi catalogo :", sorted(e)); print("campi codice   :", json.dumps(cod(e), ensure_ascii=False)); print("campi variante :", sorted(v)); print("codici variante:", json.dumps(cod(v), ensure_ascii=False))'
              done
              ;;
            ordini)
              # SOLA LETTURA sul portale Makito: la riga d'ordine ha sia
              # "variant" sia "reference" e la specifica non dice quale porti il
              # codice articolo. I documenti veri sì.
              curl -sS -m 300 -H "x-api-key: $HUB_API_KEY" "$HUB_URL/makito/ordini" \
                | python3 -m json.tool --no-ensure-ascii
              ;;
            codici)
              # Censimento ref vs web_reference su tutto lo snapshot. In "chiavi"
              # le ref da mostrare comunque (senza sigla), separate da spazio.
              R=$(printf '%s' "${{ inputs.chiavi }}" | tr ' ' ',')
              curl -sS -m 600 -H "x-api-key: $HUB_API_KEY" \
                "$HUB_URL/makito/codici?ref=$R" \
                | python3 -m json.tool --no-ensure-ascii
              ;;
            prova)
              # Giro a vuoto: dice cosa manderebbe e PERCHE' (campi_cambiati),
              # senza toccare l'importer ne' lo stato. Nato per pfconcept, che
              # rimanda ~1.450 articoli a notte: la diagnosi costa dieci minuti
              # invece delle due ore e tre quarti di un giro vero.
              J="${{ inputs.job }}"; J="${J:-prodotti}"
              curl -sS -m 60 -X POST -H "x-api-key: $HUB_API_KEY" \
                "$HUB_URL/run/$F/$J?prova=1"
              echo
              echo "== polling /status ogni 30 s (max 20 min) =="
              sleep 20
              for i in $(seq 1 40); do
                s=$(curl -sS -m 60 -H "x-api-key: $HUB_API_KEY" "$HUB_URL/status" || echo '{}')
                if printf '%s' "$s" | sed -n 's/.*"in_corso":{\([^}]*\)}.*/\1/p' \
                     | grep -q "\"$F\""; then attivo=si; else attivo=no; fi
                echo "[poll $i] $F attivo=$attivo"
                if [ "$attivo" = "no" ] && [ "$i" -gt 1 ]; then break; fi
                sleep 30
              done
              echo "== esito (ultimo run in coda a ultimi_run) =="
              curl -sS -m 60 -H "x-api-key: $HUB_API_KEY" "$HUB_URL/status" \
                | python3 -c 'import json,sys; d=json.load(sys.stdin); f="'"$F"'"; r=(d["ultimi_run"].get(f) or [])[-1:]; print(json.dumps(r, ensure_ascii=False, indent=1))'
              ;;
            diff)
              # Perche' QUESTO articolo verrebbe rimandato. In "chiavi" le chiavi
              # intere (34-100182), separate da spazio.
              for c in ${{ inputs.chiavi }}; do
                echo "===== $F $c"
                curl -sS -m 120 -H "x-api-key: $HUB_API_KEY" "$HUB_URL/diff/$F/$c" \
                  | python3 -m json.tool --no-ensure-ascii
              done
              ;;
            feed-diff)
              # Riscarica i feed del fornitore e li confronta con la copia in
              # cache: guarda i dati del fornitore, non i nostri payload.
              curl -sS -m 600 -H "x-api-key: $HUB_API_KEY" "$HUB_URL/feed-diff/$F" \
                | python3 -m json.tool --no-ensure-ascii
              ;;
            riarma)
              printf '%s' "${{ inputs.chiavi }}" \
                | python3 -c 'import json,sys; print(json.dumps({"chiavi": sys.stdin.read().split()}))' \
                > /tmp/chiavi.json
              curl -sS -m 60 -X POST -H "x-api-key: $HUB_API_KEY" \
                -H "content-type: application/json" -d @/tmp/chiavi.json \
                "$HUB_URL/riarma/$F"
              ;;
            reinvia-falliti)
              curl -sS -m 60 -X POST -H "x-api-key: $HUB_API_KEY" \
                "$HUB_URL/reinvia-falliti/$F"
              ;;
            errori)
              curl -sS -m 60 -H "x-api-key: $HUB_API_KEY" \
                "$HUB_URL/send-log/$F?n=20&solo_errori=true"
              ;;
            *)
              echo "== avvio job $azione ($F) =="
              Q=""
              if [ -n "${{ inputs.workers }}" ]; then Q="workers=${{ inputs.workers }}"; fi
              SOLO="${{ inputs.solo }}"
              if [ -n "$SOLO" ]; then
                Q="$Q&solo=$(printf '%s' "$SOLO" | tr ' ' ',')"
              fi
              curl -sS -m 60 -X POST -H "x-api-key: $HUB_API_KEY" \
                "$HUB_URL/run/$F/$azione?$Q"
              echo
              # POST /run e' fire-and-forget: il job prosegue su Railway anche se
              # questo workflow finisce. Si resta in ascolto 10 minuti - tanto
              # bastano a stock/prezzi - e poi si esce lasciando il run al hub.
              # Si guarda SOLO il fornitore di questo run: prima bastava un job
              # di un altro fornitore in corso per tenere acceso il runner.
              echo "== polling /status ogni 30 s (max 10 min) =="
              sleep 20
              finito=no
              for i in $(seq 1 20); do
                s=$(curl -sS -m 60 -H "x-api-key: $HUB_API_KEY" "$HUB_URL/status" || echo '{}')
                if printf '%s' "$s" | sed -n 's/.*"in_corso":{\([^}]*\)}.*/\1/p' \
                     | grep -q "\"$F\""; then attivo=si; else attivo=no; fi
                echo "[poll $i] $F attivo=$attivo"
                if [ "$attivo" = "no" ] && [ "$i" -gt 1 ]; then finito=si; break; fi
                sleep 30
              done
              if [ "$finito" = "si" ]; then
                echo "== run terminato =="
              else
                echo "== run ancora in corso su Railway - il workflow esce qui =="
                echo "   ricontrolla piu' tardi con azione 'status' (o 'errori' per i falliti)."
              fi
              echo "== esito finale =="
              curl -sS -m 60 -H "x-api-key: $HUB_API_KEY" "$HUB_URL/status"
              ;;
          esac
