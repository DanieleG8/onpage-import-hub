name: Hub ops

# Ponte operativo verso il servizio Railway (la sandbox Claude non raggiunge
# up.railway.app): ogni azione chiama il hub via HTTPS e stampa la risposta nei
# log del run. Le azioni che lanciano un job fanno anche polling dello /status
# fino a fine corsa. Richiede il secret HUB_API_KEY (stesso valore di Railway).

on:
  workflow_dispatch:
    inputs:
      azione:
        description: "Azione sul hub"
        required: true
        type: choice
        default: health
        options:
          - health
          - img-test
          - img-url
          - status
          - errori
          - reinvia-falliti
          - riarma
          - payload
          - bootstrap
          - stock
          - prezzi
          - prodotti
          - full
      fornitore:
        description: "Fornitore (makito | nwg)"
        required: false
        default: "makito"
      solo:
        description: "Chiavi da inviare (separate da spazio) per run mirati"
        required: false
        default: ""
      percorso:
        description: "Percorsi immagine per img-url (separati da spazio)"
        required: false
        default: ""
      chiavi:
        description: "Chiavi articolo per riarma (separate da spazio)"
        required: false
        default: ""
      workers:
        description: "Worker per i job di invio (vuoto = default 3)"
        required: false
        default: ""

env:
  HUB_URL: https://onpage-import-hub-production.up.railway.app

jobs:
  ops:
    runs-on: ubuntu-latest
    # Il lavoro gira su Railway: qui si fa solo da telecomando. Prima il runner
    # restava acceso fino a 5h50 a contare i secondi (2.381 minuti in 30 giorni).
    timeout-minutes: 20
    steps:
      - name: Esegui azione sul hub
        env:
          HUB_API_KEY: ${{ secrets.HUB_API_KEY }}
        run: |
          set -o pipefail
          azione="${{ inputs.azione }}"
          F="${{ inputs.fornitore }}"
          F="${F:-makito}"
          case "$azione" in
            health)
              curl -sS -m 60 "$HUB_URL/health"
              ;;
            img-url)
              # testa uno o piu' percorsi (separati da spazio) passati in "percorso"
              for p in ${{ inputs.percorso }}; do
                curl -sS -m 120 -o /dev/null \
                  -w "$p -> HTTP %{http_code} type=%{content_type} bytes=%{size_download}\n" \
                  "$HUB_URL/img/makito/$p" || true
              done
              ;;
            img-test)
              curl -sS -m 120 -o /tmp/img.jpg \
                -w "HTTP %{http_code} content-type=%{content_type} bytes=%{size_download}\n" \
                "$HUB_URL/img/makito/15246/principal/5246-W.jpg"
              file /tmp/img.jpg || true
              ;;
            status)
              curl -sS -m 60 -H "x-api-key: $HUB_API_KEY" "$HUB_URL/status"
              ;;
            payload)
              for c in ${{ inputs.chiavi }}; do
                echo "== payload $c: articolo.immagine e prima variante =="
                curl -sS -m 60 -H "x-api-key: $HUB_API_KEY" "$HUB_URL/payload/$F/$c" \
                  | python3 -c 'import json,sys; a=json.load(sys.stdin)["articolo"]; v=(a.get("varianti") or [{}])[0]; print(json.dumps({"immagine": a.get("immagine"), "gallery": a.get("immagini"), "var0_immagine": v.get("immagine")}, ensure_ascii=False))'
              done
              ;;
            riarma)
              printf '%s' "${{ inputs.chiavi }}" \
                | python3 -c 'import json,sys; print(json.dumps({"chiavi": sys.stdin.read().split()}))' \
                > /tmp/chiavi.json
              curl -sS -m 60 -X POST -H "x-api-key: $HUB_API_KEY" \
                -H "content-type: application/json" -d @/tmp/chiavi.json \
                "$HUB_URL/riarma/$F"
              ;;
            reinvia-falliti)
              curl -sS -m 60 -X POST -H "x-api-key: $HUB_API_KEY" \
                "$HUB_URL/reinvia-falliti/$F"
              ;;
            errori)
              curl -sS -m 60 -H "x-api-key: $HUB_API_KEY" \
                "$HUB_URL/send-log/$F?n=20&solo_errori=true"
              ;;
            *)
              echo "== avvio job $azione ($F) =="
              Q=""
              if [ -n "${{ inputs.workers }}" ]; then Q="workers=${{ inputs.workers }}"; fi
              SOLO="${{ inputs.solo }}"
              if [ -n "$SOLO" ]; then
                Q="$Q&solo=$(printf '%s' "$SOLO" | tr ' ' ',')"
              fi
              curl -sS -m 60 -X POST -H "x-api-key: $HUB_API_KEY" \
                "$HUB_URL/run/$F/$azione?$Q"
              echo
              # POST /run e' fire-and-forget: il job prosegue su Railway anche se
              # questo workflow finisce. Si resta in ascolto 10 minuti - tanto
              # bastano a stock/prezzi - e poi si esce lasciando il run al hub.
              # Si guarda SOLO il fornitore di questo run: prima bastava un job
              # di un altro fornitore in corso per tenere acceso il runner.
              echo "== polling /status ogni 30 s (max 10 min) =="
              sleep 20
              finito=no
              for i in $(seq 1 20); do
                s=$(curl -sS -m 60 -H "x-api-key: $HUB_API_KEY" "$HUB_URL/status" || echo '{}')
                if printf '%s' "$s" | sed -n 's/.*"in_corso":{\([^}]*\)}.*/\1/p' \
                     | grep -q "\"$F\""; then attivo=si; else attivo=no; fi
                echo "[poll $i] $F attivo=$attivo"
                if [ "$attivo" = "no" ] && [ "$i" -gt 1 ]; then finito=si; break; fi
                sleep 30
              done
              if [ "$finito" = "si" ]; then
                echo "== run terminato =="
              else
                echo "== run ancora in corso su Railway - il workflow esce qui =="
                echo "   ricontrolla piu' tardi con azione 'status' (o 'errori' per i falliti)."
              fi
              echo "== esito finale =="
              curl -sS -m 60 -H "x-api-key: $HUB_API_KEY" "$HUB_URL/status"
              ;;
          esac
