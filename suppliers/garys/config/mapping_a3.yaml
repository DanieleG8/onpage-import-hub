# Mapping fornitore A3 - GARY'S (Gary's Uniformes, deciso con Daniele il 07/09/2026)
#
# Sorgenti (cartella Dropbox condivisa, un solo fetch):
#   catalogo.xlsx  export Shopify/Upango: una riga per SKU (EAN, modello,
#                  colore, taglia, riferimento interno, prezzo pubblico,
#                  stock, descrizioni, immagini, peso, dogana)
#   listino.xls    "Listino Prezzi": foglio "PREZZO CON IL TUO SCONTO"
#                  = prezzo d'acquisto per referenza (senza scaglioni)
#
# Decisioni:
# - TUTTI i modelli (outlet compresi); chi non ha prezzo d'acquisto a
#   listino resta SENZA quella riga listino (niente prezzo inventato).
# - "PREZZO CON IL TUO SCONTO" -> tipologia "acquisto riservato";
#   "Prezzo pubblico del sito web" (per SKU) -> tipologia "acquisto pubblico".
# - moltiplicatoreVendita: VUOTO per ora (scheda A3 su OnPage senza valore).
# - taglia "UD" = taglia unica -> null (l'importer assegna "Unica").
#
# FUORI dal formato Custom (documentato, non mappabile oggi):
#   EAN (colonna presente ma il formato non lo gestisce), video, PDF file,
#   URL icona colore, categorie (professione/articolo/collezione), codice e
#   nome doganale, flag Outlet, fogli listino "TARIFFA RISERVATA" e "PVC
#   minimo", volume (unita' non dichiarata nel file).

fornitore:
  sigla: "A3"
  nome: "garys"                    # come la raccolta fornitore su OnPage
  moltiplicatoreVendita: null
  codiceFornitoreERP:              # GARY'S UNIFORMES SLU (fornitori_erp id 111656386)
    erp_id: "77110"
  fornitoreErpIds: [111656386]

parametriImport:
  rendiObsoletiArticoliNonPresenti: false
  gestioneImmagini: "sostituisci"
  gestioneGiacenze: "sostituisci"

listino:
  tipologia_acquisto: "acquisto riservato"     # dal listino Dropbox
  tipologia_pubblico: "acquisto pubblico"      # dal catalogo (prezzo sito)
  foglio_acquisto: "PREZZO CON IL TUO SCONTO"

magazzino:
  codice: "GARYS"
  nome: "Magazzino Gary's"

